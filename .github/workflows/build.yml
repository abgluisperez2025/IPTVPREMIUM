name: Build IPTVPremium Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

# CRÍTICO: Permisos de escritura para que el push no falle (Error 403)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Compilar plugin
        run: ./gradlew :IPTVPremium:make

      - name: Checkout rama builds
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds-branch

      - name: Copiar plugin a builds y generar JSON
        run: |
          cp IPTVPremium/build/IPTVPremium.cs3 builds-branch/IPTVPremium.cs3

          JAR_HASH=$(sha256sum builds-branch/IPTVPremium.cs3 | cut -d' ' -f1)
          JAR_SIZE=$(wc -c < builds-branch/IPTVPremium.cs3)

          printf '[{"url":"https://raw.githubusercontent.com/abgluisperez2025/IPTVPREMIUM/builds/IPTVPremium.cs3","status":1,"version":1,"name":"IPTV Premium","internalName":"IPTVPremium","authors":["abgluisperez2025"],"description":"IPTV Premium - 77000+ canales en español","fileSize":%d,"repositoryUrl":"https://github.com/abgluisperez2025/IPTVPREMIUM","language":"es","tvTypes":["Live"],"iconUrl":"https://raw.githubusercontent.com/phisher98/TVVVV/refs/heads/main/Icons/IPTV.png","apiVersion":1,"fileHash":"sha256-%s","jarFileSize":%d,"jarUrl":"https://raw.githubusercontent.com/abgluisperez2025/IPTVPREMIUM/builds/IPTVPremium.cs3","jarHash":"sha256-%s"}]' \
          "$JAR_SIZE" "$JAR_HASH" "$JAR_SIZE" "$JAR_HASH" \
          > builds-branch/plugins.json

      - name: Push a builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd builds-branch
          git config user.email "abgluisperez@gmail.com"
          git config user.name "abgluisperez2025"

          git add IPTVPremium.cs3 plugins.json

          git diff --cached --quiet || git commit -m "Build: IPTVPremium compilado"

          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/abgluisperez2025/IPTVPREMIUM.git
          git push origin builds
